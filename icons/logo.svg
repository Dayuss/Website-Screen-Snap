<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Website Screen Snap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- viewfinder corners -->
  <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 50V38a8 8 0 0 1 8-8h12"/>
    <path d="M78 30h12a8 8 0 0 1 8 8v12"/>
    <path d="M30 78v12a8 8 0 0 0 8 8h12"/>
    <path d="M78 98h12a8 8 0 0 0 8-8V78"/>
  </g>
  <!-- the website being captured -->
  <rect x="42" y="44" width="44" height="40" rx="6" fill="#fff" fill-opacity=".2"/>
  <path d="M48 44h32a6 6 0 0 1 6 6v3H42v-3a6 6 0 0 1 6-6z" fill="#fff" fill-opacity=".92"/>
  <circle cx="48" cy="48.5" r="1.6" fill="#4338ca"/>
  <circle cx="53.5" cy="48.5" r="1.6" fill="#4338ca"/>
  <circle cx="59" cy="48.5" r="1.6" fill="#4338ca"/>
  <!-- shutter -->
  <circle cx="64" cy="69" r="7.5" fill="#4cd7f6"/>
  <circle cx="64" cy="69" r="3" fill="#0a0e17" fill-opacity=".35"/>
</svg>
